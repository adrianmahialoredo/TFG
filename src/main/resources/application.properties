# Application name
spring.application.name=myapp

# Server port
server.address=0.0.0.0
server.port=8080

# Security is now configured explicitly in com.demo.demo.config.SecurityConfig.
# Only the actuator management security auto-configuration remains excluded to
# keep the previous (open) behaviour of the actuator endpoints.
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration


# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=postgres
spring.datasource.password=navega33
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Change to 'create' if you prefer the database to be created each time
spring.jpa.hibernate.ddl-auto=update
# Show SQL queries in the console for debugging
spring.jpa.show-sql=true

# Connection pool configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false


