# Application name
spring.application.name=myapp

# Local variables (KEY=VALUE) from the .env file in the working directory, if it exists
spring.config.import=optional:file:.env[.properties]

# Server port
server.address=0.0.0.0
server.port=8080

# Security is configured in com.uo289390.toco.config.SecurityConfig (actuator included:
# /actuator/health is public and the rest requires ADMIN), so Boot's actuator security is excluded.
spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration


# PostgreSQL database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=postgres
# Secret: defined in .env (DB_PASSWORD)
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Change to 'create' if you prefer the database to be created each time
spring.jpa.hibernate.ddl-auto=update
# Show SQL queries in the console for debugging
spring.jpa.show-sql=true

# Connection pool configuration
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false


# Spotify API configuration
# Secrets: defined in .env (SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET)
spotify.client-id=${SPOTIFY_CLIENT_ID}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET}
# To test from the phone, set SPOTIFY_REDIRECT_URI (in .env or as an environment variable) to an HTTPS
# tunnel (e.g. https://<domain>.ngrok-free.dev/api/spotify/callback); Spotify only accepts HTTPS or 127.0.0.1
spotify.redirect-uri=${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/api/spotify/callback}

# Initial administrator (com.uo289390.toco.config.AdminBootstrap). Created or promoted at startup
# if ADMIN_EMAIL and ADMIN_PASSWORD are set in .env; the data loading scripts log in with it.
app.admin.email=${ADMIN_EMAIL:}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}


# Outgoing email (verification code of the registration, com.uo289390.toco.service.EmailServiceImpl)
# SMTP server and credentials: defined in .env (MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM).
# Without MAIL_HOST no email is sent: the code is written to the log instead (local development).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Sender: MAIL_FROM, or the SMTP account itself (Gmail rejects other addresses)
app.mail.from=${MAIL_FROM:TOCO <${MAIL_USERNAME:no-reply@toco.app}>}
