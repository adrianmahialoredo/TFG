# Test configuration: in-memory H2 database (PostgreSQL compatibility mode),
# so the test suite runs without a local PostgreSQL instance.
spring.application.name=myapp-test

spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

jwt.secret-key=testSecretKeyForJwtThatIsLongEnough1234567890

spotify.client-id=test-client-id
spotify.client-secret=test-client-secret
spotify.redirect-uri=http://127.0.0.1:8080/api/spotify/callback
